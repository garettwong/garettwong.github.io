<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NES Dream · Player</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a10;color:#e8ebf3;font:16px Arial,sans-serif}#game{width:100%;height:100%}#status{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center}#art-layer{position:absolute;pointer-events:none;z-index:2;display:none}.ejs_menu_bar,.ejs_virtualGamepad{z-index:5!important}
