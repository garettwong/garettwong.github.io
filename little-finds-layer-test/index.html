<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tea for Two · Little Finds</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f1e6;color:#334c40;font:16px system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:22px 18px 28px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}h1{font:700 clamp(24px,4vw,38px) Georgia,serif;margin:5px 0}.eyebrow{font-size:11px;letter-spacing:.17em;color:#92764d}button{font:inherit;cursor:pointer;border:1px solid #c9cbbc;background:#fffdf7;border-radius:16px;color:#334c40;padding:11px 17px}button:focus-visible{outline:3px solid #cb8b48;outline-offset:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.stage{position:relative;aspect-ratio:3/2;isolation:isolate;border-radius:22px;overflow:hidden;box-shadow:0 10px 35px #43311720;background:#e4dbc6}.backdrop{width:100%;height:100%;display:block}.treasure{position:absolute;display:block;padding:0;border:0;border-radius:0;background:none;overflow:visible;transform-origin:50% 90%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.treasure img{position:absolute;max-width:none;pointer-events:none;user-select:none}.treasure:focus-visible{outline:2px dashed #f9c359;border-radius:30%}.treasure[hidden]{display:none}.stage.empty .treasure{visibility:hidden}.bottom{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-top:20px}.tray{display:flex;gap:10px}.card{width:83px;height:86px;background:#fffdf8;border:1px solid #ded8c9;border-radius:15px;display:grid;place-items:center;position:relative;transition:opacity .2s}.card img{width:72px;height:60px;object-fit:contain}.card span{font-size:11px;position:absolute;bottom:5px}.card.found{opacity:.38}.card.found:after{content:'✓';position:absolute;right:7px;top:4px;color:#286b3d;font-weight:800}.hint{font-size:13px;color:#747969;margin:7px 0}.status{font-weight:650}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#f7f1e6e8;font-weight:600}#loading[hidden]{display:none}@media(max-width:600px){main{padding:15px 10px}header{display:block;margin-bottom:12px}.actions{margin-top:12px}h1{font-size:28px}.stage{border-radius:14px}.bottom{display:block}.tray{margin-top:14px;justify-content:center}.card{width:75px;height:81px}.hint{line-height:1.5}button{font-size:14px;padding:10px 13px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main>
<header><div><span class="eyebrow">LITTLE FINDS · A SMALL ART TEST</span><h1>Tea for Two</h1><p class="hint">A quiet afternoon above the harbour.</p></div><div class="actions"><button id="background" aria-pressed="false">See empty background</button><button id="reset">Put everything back</button></div></header>
<div class="stage" id="stage"><img class="backdrop" src="background.png" alt="Sunlit Hong Kong balcony with an empty wooden table and stool"><div id="loading" role="status">Setting the table…</div></div>
<div class="bottom"><div><div class="status" id="status" role="status" aria-live="polite">0 / 4 found</div><p class="hint">Tap the teapot, cup, bun and sleepy cat.<br>Each one lifts away, leaving the original background underneath.</p></div><div class="tray" id="tray" aria-label="Objects to find"></div></div>
</main><script type="module">
const stage=document.getElementById('stage'),tray=document.getElementById('tray'),status=document.getElementById('status'),toggle=document.getElementById('background');
const objects=[{id:'teapot',label:'Teapot',x:440,y:430,w:230},{id:'cup',label:'Tea cup',x:700,y:505,w:128},{id:'bun',label:'Butter bun',x:900,y:488,w:155},{id:'cat',label:'Sleepy cat',x:1193,y:553,w:217}];
let found=new Set(),empty=false;const buttons=[],animations=new Set();
function update(){status.textContent=empty?'The complete background — no patches':found.size===4?'All four found. Tea time!':`${found.size} / 4 found`;for(const o of objects)document.getElementById('card-'+o.id)?.classList.toggle('found',found.has(o.id));}
try{const res=await fetch('assets.json');if(!res.ok)throw new Error('Asset list unavailable');const metadata=await res.json();
for(const o of objects){const m=metadata[o.id],b=m.bounds,sw=b[2]-b[0],sh=b[3]-b[1],h=o.w*sh/sw;const button=document.createElement('button');button.className='treasure';button.id=o.id;button.setAttribute('aria-label','Collect '+o.label);button.style.cssText=`left:${o.x/1536*100}%;top:${o.y/1024*100}%;width:${o.w/1536*100}%;height:${h/1024*100}%`;const img=document.createElement('img');img.src=o.id+'.png';img.alt='';img.draggable=false;img.style.cssText=`width:${m.size[0]/sw*100}%;height:${m.size[1]/sh*100}%;left:${-b[0]/sw*100}%;top:${-b[1]/sh*100}%`;button.append(img);stage.append(button);buttons.push(button);
const card=document.createElement('div');card.className='card';card.id='card-'+o.id;const thumb=document.createElement('img');thumb.src=img.src;thumb.alt=o.label;const label=document.createElement('span');label.textContent=o.label;card.append(thumb,label);tray.append(card);
button.onclick=()=>{if(found.has(o.id)||empty)return;found.add(o.id);button.disabled=true;update();const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const animation=button.animate(reduced?[{opacity:1},{opacity:0}]:[{transform:'translateY(0) scale(1)',opacity:1,offset:0},{transform:'translateY(-12px) scale(1.18)',opacity:1,offset:.4},{transform:'translateY(-36px) scale(.8)',opacity:0,offset:1}],{duration:reduced?150:600,easing:'ease-in-out',fill:'forwards'});animations.add(animation);animation.finished.then(()=>{button.hidden=true;}).catch(()=>{}).finally(()=>{animations.delete(animation);animation.cancel();});};}
await Promise.all([...document.images].map(im=>im.complete&&im.naturalWidth?Promise.resolve():new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject})));document.getElementById('loading').hidden=true;
}catch(error){document.getElementById('loading').textContent='The artwork could not load. Please reload to try again.';console.error(error);}
toggle.onclick=()=>{empty=!empty;stage.classList.toggle('empty',empty);toggle.setAttribute('aria-pressed',String(empty));toggle.textContent=empty?'Show the objects':'See empty background';update();};
document.getElementById('reset').onclick=()=>{for(const a of animations)a.cancel();animations.clear();found.clear();for(const b of buttons){b.hidden=false;b.disabled=false;}empty=false;stage.classList.remove('empty');toggle.textContent='See empty background';toggle.setAttribute('aria-pressed','false');update();};
</script></body></html>
